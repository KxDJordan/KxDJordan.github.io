<title>Starfall Nine</title>

<style>
/* Shared design tokens (used by base.css and match.css). Keep the names stable. */
:root{--bg:#0a0e13;--surface:#121821;--surface-2:#1a222e;--surface-3:#232d3b;--line:rgba(255,255,255,.09);--line-strong:rgba(255,255,255,.18);--text:#e9eef4;--text-dim:#8c98a8;--accent:var(--c1);--accent-2:var(--c2);--gold-2:#f2c14e;--good:#3ecf8e;--bad:#ef5b5b;--info:#4aa8ff;--font-disp:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;--font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--r:10px;--r-sm:6px;--shadow:0 6px 24px rgba(0,0,0,.35)}
:root{--night:#12163a;--dusk:#262060;--plum:#4a2f7a;--chalk:#f6f1e4;--paper:#fffaf0;--ink:#0b0d24;--sun:#ff8a3c;--gold:#ffd23f;--grass:#2fae74;--sky:#57c7ff;--rose:#ff5c8a;--c1:#e23d4b;--c2:#ffd23f;
--disp:'Dela Gothic One','Arial Black',Impact,sans-serif;--body:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Trebuchet MS',system-ui,sans-serif;
color-scheme:dark;box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
html{background:#12163a}
body{background:var(--night);color:var(--chalk);font-family:var(--body);font-weight:500;font-size:13px;line-height:1.35;overflow:hidden;-webkit-user-select:none;user-select:none}
#app{position:relative;height:100%;width:100%;overflow:hidden;background:radial-gradient(rgba(255,255,255,.07) 1.2px,transparent 1.4px) 0 0/11px 11px,linear-gradient(160deg,var(--night),var(--dusk) 55%,var(--plum))}
button{font-family:inherit;color:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:14px;-webkit-user-select:text;user-select:text}
.disp{font-family:var(--disp);font-weight:400;letter-spacing:.01em}
.btn{background:var(--sun);color:var(--ink);border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);border-radius:4px;font-weight:800;font-size:13px;padding:8px 14px;min-height:40px;transition:transform .06s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.alt{background:var(--paper)}.btn.gold{background:var(--gold)}.btn.sky{background:var(--sky)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.45;pointer-events:none}
.btn:focus-visible,.nav button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.panel{background:var(--paper);color:var(--ink);border:2.5px solid var(--ink);box-shadow:4px 4px 0 var(--ink);border-radius:4px;padding:10px 12px;margin-bottom:12px;position:relative}
.panel h2{font-family:var(--disp);font-weight:400;font-size:15px;margin:-10px -12px 8px;padding:5px 12px;background:var(--ink);color:var(--chalk);display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel h2 small{font-family:var(--body);font-weight:700;font-size:11px;color:var(--gold)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.cols.w{grid-template-columns:1.25fr 1fr}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.chip{display:inline-block;background:var(--ink);color:var(--chalk);border-radius:99px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.chip.g{background:var(--gold);color:var(--ink)}.chip.o{background:var(--sun);color:var(--ink)}.chip.b{background:var(--sky);color:var(--ink)}.chip.gr{background:var(--grass);color:var(--ink)}.chip.r{background:var(--rose);color:var(--ink)}
.mut{opacity:.65;font-size:11.5px}

.hub{display:grid;grid-template-columns:78px 1fr;grid-template-rows:auto 1fr;height:100%}
.top{grid-column:1/3;display:flex;align-items:center;gap:8px;padding:5px 10px;background:var(--ink);border-bottom:3px solid var(--c1);min-height:46px}
.top .tn{font-family:var(--disp);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{overflow-y:auto;display:flex;flex-direction:column;background:rgba(11,13,36,.75);border-right:2px solid var(--ink)}
.nav button{background:none;border:0;border-left:4px solid transparent;min-height:34px;flex:1;max-height:48px;font-size:12px;font-weight:700;text-align:left;padding:0 8px;color:var(--chalk);opacity:.75}
.nav button.on{opacity:1;border-left-color:var(--c2);background:var(--c1);color:#fff;text-shadow:1px 1px 0 var(--ink)}
.main{overflow-y:auto;padding:12px 14px 24px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:12px}
th{font-size:10.5px;text-align:left;opacity:.6;font-weight:700;padding:2px 4px}
td{padding:3px 4px;border-top:1.5px solid rgba(11,13,36,.12);white-space:nowrap}
tr.tap:active,tr.sel{background:rgba(255,138,60,.25)}
tr.me td{background:rgba(255,210,63,.35);font-weight:800}
.n{text-align:right;font-variant-numeric:tabular-nums}
.r0{opacity:.5}.r2{color:#0a7a4b;font-weight:800}.r3{color:#c2410c;font-weight:800}
.bar{height:8px;background:rgba(11,13,36,.15);border-radius:9px;overflow:hidden;min-width:40px}

.bar.f i{background:var(--rose)}.bar.z i{background:linear-gradient(90deg,var(--sun),var(--gold))}

.opt{border:2.5px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:4px;padding:8px 10px;text-align:left;font-weight:700;font-size:12px;min-height:40px}
.opt.on{background:var(--gold);box-shadow:3px 3px 0 var(--ink)}
.opt b{display:block;font-size:13px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sw{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--ink);padding:0}
.sw.on{outline:3px solid var(--gold);outline-offset:1px}
.lg{width:44px;height:44px;padding:2px;border:2.5px solid transparent;background:none;border-radius:6px}
.lg.on{border-color:var(--gold);background:rgba(255,210,63,.2)}
/* title + create */
.title{height:100%;display:flex;align-items:center;justify-content:center;position:relative}
.title canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.title .tw{position:relative;text-align:center;padding:16px}
.logo{font-family:var(--disp);font-size:clamp(38px,11vw,84px);line-height:.95;color:var(--gold);-webkit-text-stroke:2px var(--ink);text-shadow:5px 5px 0 var(--ink),7px 7px 0 var(--sun);transform:rotate(-4deg) skewX(-6deg);margin-bottom:18px}
.logo span{display:block;color:var(--chalk);font-size:.42em;text-shadow:3px 3px 0 var(--ink);letter-spacing:.06em}
.wiz{height:100%;display:flex;flex-direction:column}
.wiz .body{flex:1;overflow-y:auto;padding:12px 14px}
.wiz .foot{display:flex;gap:10px;padding:8px 14px;background:var(--ink);align-items:center}
.fld{display:block;font-weight:800;font-size:11.5px;margin:6px 0 3px}
.inp{width:100%;border:2.5px solid var(--ink);border-radius:4px;padding:7px 9px;background:#fff;color:var(--ink);font-weight:700}
/* skill tree */
.br{display:flex;align-items:center;gap:0;margin-bottom:8px}
.br .bl{width:74px;font-family:var(--disp);font-size:12px;flex:none}
.nd{flex:1;min-height:44px;border:2.5px solid var(--ink);border-radius:4px;background:#e9e2cf;color:var(--ink);font-size:10.5px;font-weight:800;padding:3px 4px;line-height:1.15;position:relative}
.nd.own{background:var(--gold)}.nd.can{background:#fff;box-shadow:0 0 0 2px var(--sun) inset}.nd.cur{outline:3px solid var(--sky);outline-offset:1px}
.ln{width:12px;height:4px;background:var(--ink);flex:none;opacity:.35}.ln.on{opacity:1;background:var(--sun)}
/* modal */
.modal{position:absolute;inset:0;background:rgba(11,13,36,.78);display:flex;align-items:center;justify-content:center;z-index:50;padding:10px}
.modal .panel{max-width:640px;width:100%;max-height:100%;overflow-y:auto;margin:0}
.stat{display:grid;grid-template-columns:54px 1fr 26px;gap:6px;align-items:center;font-size:11.5px;font-weight:700;margin:2px 0}
#rot{position:absolute;inset:0;z-index:99;background:var(--ink);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
@media (orientation:portrait){#rot.ask{display:flex}}
.ph{width:54px;height:92px;border:4px solid var(--chalk);border-radius:10px;animation:tilt 2s ease-in-out infinite}
@keyframes tilt{0%,25%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
.ls td,.ls th{text-align:center;padding:2px 5px}.ls td:first-child,.ls th:first-child{text-align:left}
@media (max-width:560px){.cols,.cols.w{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.ph,#cut.go .lines{animation:none}}
</style>
<style>

.mt{position:absolute;inset:0;background:#0c1036;overflow:hidden}
.mt canvas#cv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.hudp{position:absolute;background:rgba(11,13,36,.86);border:2px solid var(--ink);border-radius:5px;padding:5px 8px;font-size:11.5px;color:var(--chalk);box-shadow:3px 3px 0 rgba(0,0,0,.4)}
.sb{left:8px;top:8px;display:flex;gap:10px;align-items:center}
.sb .tm{display:grid;grid-template-columns:20px 38px 22px;align-items:center;gap:4px;font-weight:800;font-size:13px}
.sb .tm .n{font-family:var(--disp);font-size:15px;color:var(--gold)}
.sb .inn{text-align:center;font-weight:800;line-height:1.1}
.dots i{display:inline-block;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--chalk);margin-right:2px}.dots i.on{background:var(--rose);border-color:var(--rose)}
.ctl{right:8px;top:8px;display:flex;gap:5px;flex-wrap:wrap;max-width:46%;justify-content:flex-end;background:none;border:0;box-shadow:none;padding:0}
.ctl .btn{min-height:34px;padding:3px 9px;font-size:11.5px}
.ctl .btn.on{background:var(--gold)}
.tick{left:50%;top:60px;transform:translateX(-50%);max-width:60%;text-align:center;font-weight:700;pointer-events:none;transition:opacity .2s}
.pc{bottom:8px;width:176px;display:grid;grid-template-columns:44px 1fr;gap:6px;align-items:center}
.pc.l{left:8px}.pc.r{right:8px}
.pc canvas{width:44px;height:44px;border-radius:5px;border:2px solid var(--chalk);background:#333}
.pc b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.pc .bar{background:rgba(255,255,255,.18);margin-top:3px;height:6px}
.pc.zone{border-color:var(--gold);box-shadow:0 0 14px var(--gold)}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-family:var(--disp);font-size:clamp(30px,8vw,64px);color:var(--gold);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink),6px 6px 0 var(--rose);pointer-events:none;opacity:0;transform:rotate(-4deg)}
#banner.go{animation:ban var(--bd,1.3s) both}
#banner.sm{font-size:clamp(20px,5vw,36px);color:var(--chalk);text-shadow:3px 3px 0 var(--ink)}
@keyframes ban{0%{opacity:0;transform:rotate(-4deg) scale(2.2)}18%{opacity:1;transform:rotate(-4deg) scale(1)}80%{opacity:1;transform:rotate(-4deg) scale(1.04)}100%{opacity:0;transform:rotate(-4deg) scale(1.1) translateX(40px)}}
#cut{position:absolute;inset:0;pointer-events:none;opacity:0;overflow:hidden;--zc:#ff8a3c;--cd:1.8s}
#cut.go{animation:cutA var(--cd) both}
#cut .dim{position:absolute;inset:0;background:rgba(11,13,36,.6)}
#cut .band{position:absolute;left:-10%;right:-10%;top:22%;height:56%;background:radial-gradient(rgba(11,13,36,.2) 2px,transparent 2.4px) 0 0/9px 9px,linear-gradient(90deg,transparent,rgba(255,255,255,.4) 50%,transparent),var(--zc);border-top:5px solid var(--ink);border-bottom:5px solid var(--ink);transform:skewY(-5deg)}
#cut .lines{position:absolute;inset:-20% -20%;background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(255,255,255,.5) 22px 24px,transparent 24px 61px,rgba(255,255,255,.3) 61px 62px);transform:skewY(-5deg);-webkit-mask-image:linear-gradient(transparent 26%,#000 34%,#000 66%,transparent 74%);mask-image:linear-gradient(transparent 26%,#000 34%,#000 66%,transparent 74%)}
#cut.go .lines{animation:lines .35s linear infinite}
#cut canvas{position:absolute;left:6%;top:50%;height:74%;aspect-ratio:1;transform:translateY(-54%)}
#cut.go canvas{animation:cutP var(--cd) both}
#cut .tx{position:absolute;left:44%;right:3%;top:50%;transform:translateY(-55%) rotate(-5deg)}
#cut.go .tx{animation:cutT var(--cd) both}
#cut .k{font-family:var(--disp);font-size:clamp(13px,3.2vw,22px);color:var(--ink);background:var(--gold);display:inline-block;padding:1px 10px;border:2.5px solid var(--ink)}
#cut .nm{font-family:var(--disp);font-size:clamp(24px,6.4vw,54px);line-height:1;color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);margin:6px 0}
#cut .ds{font-weight:800;font-size:clamp(11px,2.3vw,15px);color:var(--ink);background:rgba(255,250,240,.92);display:inline-block;padding:2px 8px;border-radius:3px}
@keyframes cutA{0%{opacity:0}8%{opacity:1}88%{opacity:1}100%{opacity:0}}
@keyframes cutP{0%{transform:translate(-120%,-54%)}14%{transform:translate(4%,-54%)}88%{transform:translate(8%,-54%)}100%{transform:translate(60%,-54%)}}
@keyframes cutT{0%{transform:translate(120%,-55%) rotate(-5deg)}16%{transform:translate(0,-55%) rotate(-5deg)}88%{transform:translate(-3%,-55%) rotate(-5deg)}100%{transform:translate(-80%,-55%) rotate(-5deg)}}
@keyframes lines{to{background-position:-124px 0}}
</style>
</head>

function tryoutState(){const t=UT(),sel=G.try.pool.filter(p=>G.try.picked.includes(p.id)),all=t.roster.concat(sel),np=all.filter(isP).length,nb=all.length-np;

function finishTryouts(auto){const t=UT();
  if(auto){G.try.picked=[];const pl=G.try.pool.slice().sort((a,b)=>(b.pot+ovr(b))-(a.pot+ovr(a)));const cnt=()=>{const s=tryoutState();return s};
